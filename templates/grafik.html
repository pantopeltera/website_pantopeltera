<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistik - PANTOPELTERA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        #sidebar { transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .sidebar-closed { transform: translateX(-100%); position: absolute; }
        
        .dashboard-bg { 
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.65), rgba(255, 255, 255, 0.75)), 
                url("{{ url_for('static', filename='img/background-itera.jpg') }}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="bg-white text-slate-800 h-screen overflow-hidden flex dashboard-bg">

    <div id="sidebar" class="w-72 bg-[#0f172a] text-white p-8 flex flex-col space-y-8 z-50 shadow-2xl shrink-0 h-screen transition-all">
        <div class="flex justify-between items-center">
            <div class="flex items-center space-x-2 text-teal-400">
                <div class="w-2 h-2 bg-teal-400 rounded-full animate-pulse"></div>
                <span class="text-[10px] font-bold tracking-[0.2em] uppercase">PANTOPELTERA</span>
            </div>
            <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white text-2xl font-light">&times;</button>
        </div>

        <nav class="flex-1 space-y-2">
            <p class="text-slate-500 text-[10px] font-bold tracking-widest uppercase mb-4">Main Menu</p>
            <a href="/dashboard" class="flex items-center space-x-3 p-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-all">
                <span>🏠</span> <span>Dashboard</span>
            </a>
            <a href="/monitoring" class="flex items-center space-x-3 p-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-all">
                <span>📹</span> <span>Live Monitoring</span>
            </a>
            <a href="/pelanggaran" class="flex items-center space-x-3 p-3 rounded-xl text-slate-400 hover:text-white hover:bg-slate-800 transition-all">
                <span>🚨</span> <span>Pelanggaran</span>
            </a>
            <a href="/grafik" class="flex items-center space-x-3 p-3 rounded-xl bg-teal-500/10 text-teal-400 border border-teal-500/20 shadow-lg">
                <span>📊</span> <span class="font-bold">Statistik</span>
            </a>
        </nav>

       <div class="pt-8 border-t border-slate-800">
            <a href="/profil" class="flex items-center space-x-3 p-3 bg-slate-800/50 rounded-2xl border border-slate-700/50 hover:bg-slate-700/50 group transition-all">
                <div class="w-10 h-10 bg-gradient-to-tr from-teal-500 to-emerald-400 rounded-lg flex items-center justify-center font-bold text-white shadow-lg group-hover:scale-105 transition-transform">A</div>
                <div class="flex-1">
                    <p class="text-sm font-bold text-white">Admin ITERA</p>
                    <p class="text-[10px] text-slate-500 italic">Bundaran Asrama</p>
                </div>
            </a>
        </div>
    </div>

    <div class="flex-1 flex flex-col min-w-0 relative">
        <header class="px-8 py-4 flex items-center justify-between bg-white/60 backdrop-blur-md border-b border-sky-100 sticky top-0 z-30">
            <div class="flex items-center space-x-6">
                <button id="btn-open" onclick="toggleSidebar()" class="hidden flex flex-col space-y-1 p-2 hover:bg-white/50 rounded-lg transition-all">
                    <div class="w-7 h-1 bg-sky-400"></div>
                    <div class="w-7 h-1 bg-sky-400"></div>
                    <div class="w-7 h-1 bg-sky-400"></div>
                </button>
                <h1 class="text-xl font-black italic tracking-tighter text-slate-900 uppercase">Grafik Pelanggaran</h1>
            </div>
            <div class="text-right">
                <p class="text-[9px] text-teal-600 font-bold uppercase tracking-tighter">Bundaran Asrama ITERA</p>
            </div>
        </header>

        <div class="flex-1 p-8 grid grid-cols-2 gap-8 overflow-hidden">
            
            <div class="flex flex-col h-full">
                <div class="flex justify-between items-end mb-4">
                    <div>
                        <h2 class="text-xl font-black text-slate-900 tracking-tighter uppercase leading-none">Tidak Menggunakan Helm</h2>
                    </div>
                    <div class="bg-[#0f172a] text-white px-3 py-1 rounded-full text-[8px] font-bold uppercase tracking-widest shadow-lg">
                        Mei 2026
                    </div>
                </div>
                <div class="flex-1 glass-card rounded-[2.5rem] p-6 shadow-2xl relative flex flex-col border border-white/50">
                    <div class="flex-1 relative min-h-0">
                        <canvas id="helmChart"></canvas>
                    </div>
                </div>
            </div>

            <div class="flex flex-col h-full">
                <div class="flex justify-between items-end mb-4">
                    <div>
                        <h2 class="text-xl font-black text-slate-900 tracking-tighter uppercase leading-none">Melawan Arah</h2>
                    </div>
                    <div class="bg-[#0f172a] text-white px-3 py-1 rounded-full text-[8px] font-bold uppercase tracking-widest shadow-lg">
                        Mei 2026
                    </div>
                </div>
                <div class="flex-1 glass-card rounded-[2.5rem] p-6 shadow-2xl relative flex flex-col border border-white/50">
                    <div class="flex-1 relative min-h-0">
                        <canvas id="arahChart"></canvas>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const btnOpen = document.getElementById('btn-open');
        sidebar.classList.toggle('sidebar-closed');
        btnOpen.classList.toggle('hidden', !sidebar.classList.contains('sidebar-closed'));
    }

    document.addEventListener('DOMContentLoaded', function() {
        // 1. Konfigurasi Standar Grafik agar Tampilan Presisi & Profesional
        const chartOptions = {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { 
                legend: { display: false },
                tooltip: {
                    backgroundColor: 'rgba(15, 23, 42, 0.9)',
                    titleFont: { size: 12, weight: 'bold' },
                    bodyFont: { size: 12 },
                    padding: 10,
                    displayColors: false
                }
            },
            scales: {
                y: { 
                    beginAtZero: true, 
                    grid: { color: 'rgba(0,0,0,0.03)', drawBorder: false }, 
                    ticks: { stepSize: 1, font: { size: 10, weight: 'bold' } } 
                },
                x: { 
                    grid: { display: false }, 
                    ticks: { font: { size: 10, weight: 'bold' } } 
                }
            }
        };

        // 2. Inisialisasi Kerangka Awal Chart Helm (Data Diisi Dinamis oleh Fetch)
        const helmChart = new Chart(document.getElementById('helmChart'), {
            type: 'bar',
            data: {
                labels: [],
                datasets: [{
                    data: [],
                    backgroundColor: 'rgba(20, 184, 166, 0.7)',
                    borderColor: 'rgb(20, 184, 166)',
                    borderWidth: 2,
                    borderRadius: 8,
                    hoverBackgroundColor: 'rgba(20, 184, 166, 1)'
                }]
            },
            options: chartOptions
        });

        // 3. Inisialisasi Kerangka Awal Chart Melawan Arah
        const arahChart = new Chart(document.getElementById('arahChart'), {
            type: 'bar',
            data: {
                labels: [],
                datasets: [{
                    data: [],
                    backgroundColor: 'rgba(244, 63, 94, 0.7)',
                    borderColor: 'rgb(244, 63, 94)',
                    borderWidth: 2,
                    borderRadius: 8,
                    hoverBackgroundColor: 'rgba(244, 63, 94, 1)'
                }]
            },
            options: chartOptions
        });

        // 4. Fungsi Request AJAX Jabat Tangan ke API Endpoint Flask
        function updateChartsRealtime() {
            fetch('/api/statistik-pelanggaran')
                .then(response => response.json())
                .then(data => {
                    // Update data set & label untuk Grafik Helm tanpa refresh halaman
                    helmChart.data.labels = data.labels;
                    helmChart.data.datasets[0].data = data.values_helm;
                    helmChart.update();

                    // Update data set & label untuk Grafik Arah
                    arahChart.data.labels = data.labels;
                    arahChart.data.datasets[0].data = data.values_arah;
                    arahChart.update();
                })
                .catch(error => console.error('Gagal memuat data statistik real-time:', error));
        }

        // 5. Eksekusi pertama kali saat halaman dibuka oleh pengguna
        updateChartsRealtime();

        // 6. Jalankan pembaruan otomatis secara berkala setiap 5 detik (5000 ms)
        setInterval(updateChartsRealtime, 5000);
    });
    </script>
</body>
</html>
