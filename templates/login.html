<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PANTOPELTERA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght=300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Latar belakang gambar kampus dengan overlay */
        .bg-campus {
            background-image: linear-gradient(rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.4)), 
                              url('/static/img/background-itera.jpg');
            background-size: cover;
            background-position: center;
        }

        /* Efek kotak transparan (Glassmorphism) */
        .glass-card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body class="bg-campus h-screen flex flex-col items-center justify-center overflow-hidden">

    <div class="glass-card w-full max-w-md p-8 rounded-[2rem] shadow-2xl flex flex-col items-center relative">
        
        <div class="mb-2">
            <img src="/static/img/cctv-itera.png" alt="CCTV Logo" class="w-32 h-auto object-contain">
        </div>

        <h1 class="text-2xl font-[900] italic text-slate-900 tracking-tighter mb-1">PANTOPELTERA</h1>
        <h2 class="text-[11px] font-bold text-slate-800 tracking-widest uppercase mb-1">Akses Sistem Pantopeltera</h2>
        <p class="text-[10px] text-slate-500 mb-6 font-medium">Silakan masuk dengan akun anda</p>

        <form action="/auth" method="POST" class="w-full space-y-4">
            
            <div class="space-y-1">
                <label class="text-[9px] font-black uppercase tracking-wider text-slate-700 ml-1">User ID</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-3 flex items-center text-slate-400">👤</span>
                    <input type="email" name="email" placeholder="Masukkan Username" 
                           class="w-full bg-white border border-slate-200 rounded-lg py-2 pl-10 pr-4 text-sm outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition-all" required>
                </div>
            </div>

            <div class="space-y-1">
                <div class="flex justify-between items-center px-1">
                    <label class="text-[9px] font-black uppercase tracking-wider text-slate-700">Password</label>
                    
                    {% with messages = get_flashed_messages() %}
                      {% if messages %}
                        <span class="text-[9px] text-red-500 font-bold italic animate-pulse">{{ messages[0] }}</span>
                      {% endif %}
                    {% endwith %}
                </div>
                
                <div class="relative">
                    <span class="absolute inset-y-0 left-3 flex items-center text-slate-400">🔑</span>
                    
                    <input type="password" id="password-field" name="password" placeholder="Masukkan Password" 
                           class="w-full bg-white border border-slate-200 rounded-lg py-2 pl-10 pr-10 text-sm outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500 transition-all" required>
                    
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-3 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none transition-colors">
                        <span id="toggle-icon" class="text-sm select-none">👁️</span>
                    </button>
                </div>
            </div>

            <div class="pt-2">
                <button type="submit" class="w-full bg-[#0f172a] text-white py-3 rounded-xl shadow-lg hover:bg-slate-800 active:scale-[0.98] transition-all flex flex-col items-center justify-center">
                    <span class="font-bold text-sm">Masuk</span>
                    <span class="text-[8px] font-bold tracking-widest uppercase opacity-60">Pantau Pelanggaran Itera</span>
                </button>
            </div>
        </form>

        <div class="mt-8 flex flex-col items-center">
            <div class="flex items-center space-x-2 mb-2">
                <img src="/static/img/itera-logo.png" alt="Logo ITERA" class="h-10 w-auto object-contain">
                <span class="text-xl font-black tracking-tighter text-slate-700">ITERA</span>
            </div>
            <p class="text-[9px] text-slate-400 font-bold tracking-tighter uppercase">
                © 2026 Institut Teknologi Sumatera
            </p>
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const passwordField = document.getElementById('password-field');
            const toggleIcon = document.getElementById('toggle-icon');
            
            if (passwordField.type === 'password') {
                // Ubah tipe ke 'text' agar karakter password terlihat
                passwordField.type = 'text';
                // Ubah ikon visual menjadi monyet menutup mata (menandakan status "sedang mengintip")
                toggleIcon.textContent = '🙈';
            } else {
                // Kembalikan ke 'password' untuk menyembunyikan kembali
                passwordField.type = 'password';
                // Kembalikan ikon visual semula
                toggleIcon.textContent = '👁️';
            }
        }
    </script>
</body>
</html>
